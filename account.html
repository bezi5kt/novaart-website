<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Settings - NovaArt</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="container">
            <a href="index.html" class="nav-brand"><img src="logo.png" alt="NovaArt"></a>
            <ul class="nav-menu">
                <li><a href="index.html">Home</a></li>
                <li><a href="gallery.html">Gallery</a></li>
                <li><a href="order.html">Order Now</a></li>
                <li><a href="pricing.html">Pricing</a></li>
                <li><a href="contact.html">Contact</a></li>
                <li><a href="account.html" class="nav-login" id="navAuth">Account</a></li>
            </ul>
        </div>
    </nav>

    <!-- Account Section -->
    <section class="account-section">
        <div class="container">
            <h2>Account Settings</h2>
            <p class="section-subtitle">Manage your personal information and preferences</p>

            <div class="account-container">
                <div class="account-card">
                    <h3>Personal Information</h3>
                    <form id="accountForm" class="account-form">
                        <div class="form-group">
                            <label for="accountName">Full Name</label>
                            <input type="text" id="accountName" required>
                        </div>

                        <div class="form-group">
                            <label for="accountEmail">Email Address</label>
                            <input type="email" id="accountEmail" required>
                        </div>

                        <div class="form-group">
                            <label for="accountPhone">Phone Number</label>
                            <input type="tel" id="accountPhone" required>
                        </div>

                        <h3 style="margin-top: 2rem; margin-bottom: 1rem;">Default Delivery Address</h3>

                        <div class="form-group">
                            <label for="accountStreet">Street Address</label>
                            <input type="text" id="accountStreet">
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label for="accountCity">City</label>
                                <input type="text" id="accountCity">
                            </div>
                            <div class="form-group">
                                <label for="accountPostal">Postal Code</label>
                                <input type="text" id="accountPostal">
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="accountCountry">Country</label>
                            <input type="text" id="accountCountry" value="Slovenia">
                        </div>

                        <button type="submit" class="btn btn-primary btn-large">Save Changes</button>
                    </form>

                    <div class="account-actions">
                        <button id="logoutBtn" class="btn btn-outline">Log Out</button>
                    </div>
                </div>

                <div class="account-sidebar">
                    <div class="account-info">
                        <h3>Account Info</h3>
                        <p><strong>Member Since:</strong> <span id="memberSince">-</span></p>
                        <p><strong>Total Orders:</strong> <span id="totalOrders">0</span></p>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2024 NovaArt. All rights reserved.</p>
        </div>
    </footer>

    <script src="account.js"></script>
</body>
</html>
