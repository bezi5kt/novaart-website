<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - NovaArt</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="container">
            <a href="index.html" class="nav-brand"><img src="logo.png" alt="NovaArt"></a>
            <ul class="nav-menu">
                <li><a href="index.html">Home</a></li>
                <li><a href="gallery.html">Gallery</a></li>
                <li><a href="order.html">Order Now</a></li>
                <li><a href="pricing.html">Pricing</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </div>
    </nav>

    <!-- Register Section -->
    <section class="auth-section">
        <div class="container">
            <div class="auth-card">
                <h2>Create Your Account</h2>
                <p class="auth-subtitle">Join NovaArt and start creating beautiful portraits</p>

                <form id="registerForm" class="auth-form">
                    <div class="form-group">
                        <label for="regName">Full Name *</label>
                        <input type="text" id="regName" required>
                    </div>

                    <div class="form-group">
                        <label for="regEmail">Email Address (Gmail) *</label>
                        <input type="email" id="regEmail" required>
                    </div>

                    <div class="form-group">
                        <label for="regPhone">Phone Number *</label>
                        <input type="tel" id="regPhone" placeholder="+386 XX XXX XXX" required>
                    </div>

                    <div class="form-group">
                        <label for="regPassword">Password *</label>
                        <input type="password" id="regPassword" required>
                    </div>

                    <div class="form-group">
                        <label for="regConfirmPassword">Confirm Password *</label>
                        <input type="password" id="regConfirmPassword" required>
                    </div>

                    <button type="submit" class="btn btn-primary btn-large">Create Account</button>
                </form>

                <div class="auth-divider">
                    <span>Already have an account?</span>
                </div>

                <a href="login.html" class="btn btn-outline btn-large">Sign In</a>
            </div>
        </div>
    </section>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2024 NovaArt. All rights reserved.</p>
        </div>
    </footer>

    <script src="auth.js"></script>
</body>
</html>
